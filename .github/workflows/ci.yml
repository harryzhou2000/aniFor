name: verify-static-game

on:
  push:
    branches-ignore:
      - main_codex
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, build and deploy, or deploy a verified exact-SHA artifact
        required: true
        default: build
        type: choice
        options:
          - build
          - build-and-deploy
          - deploy-verified
      verified_build_run_id:
        description: Exact-SHA run with a successful build job to reuse for deploy-verified
        required: false
        default: ''
        type: string
      visual_lab_review:
        description: Capture and publish a deterministic Visual Lab review batch
        required: true
        default: false
        type: boolean
      visual_lab_capture_proof:
        description: Evidence proof used by an optional Visual Lab review
        required: true
        default: stable-snapshots
        type: choice
        options:
          - stable-snapshots
          - completed-frame-receipt
          - readiness-completed-frame-receipt
          - selection-owned-frame-receipt
          - fixture-activation-generation
          - fixture-activation-work-generation
          - fixture-activation-render-field-generation
      visual_lab_browser_host:
        description: Browser topology for optional Visual Lab diagnosis
        required: true
        default: shared
        type: choice
        options:
          - shared
          - fresh
      visual_lab_candidates:
        description: Optional ad-hoc comma-separated candidates; exclusive with cohort and recipe set
        required: false
        default: ''
        type: string
      visual_lab_cohort:
        description: Declarative checked-in review cohort; clear only for an ad-hoc selection
        required: false
        default: material-lighting
        type: string
      visual_lab_recipe_set:
        description: Explicit checked-in recipe set; exclusive with cohort and ad-hoc candidates
        required: false
        default: ''
        type: string
      visual_lab_performance_cohorts:
        description: Run the non-gating fresh/shared performance matrix
        required: true
        default: false
        type: boolean
      visual_lab_performance_cohort:
        description: Declarative checked-in cohort for the non-gating performance matrix
        required: true
        default: powder-style
        type: string
      visual_lab_performance_capture_proof:
        description: Capture proof for the non-gating performance matrix
        required: true
        default: selection-owned-frame-receipt
        type: choice
        options:
          - selection-owned-frame-receipt
          - fixture-activation-generation
          - fixture-activation-work-generation
          - fixture-activation-render-field-generation

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'deploy-verified'
    runs-on: ubuntu-latest
    # A lost hosted runner can otherwise leave the manual Pages control in an
    # apparently-running state indefinitely.  Native compilation is normally
    # far below this bound, including a cold project-local toolchain cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            # Hosted apt mirrors occasionally stop responding. Bound this
            # bootstrap separately from native compilation so the workflow
            # fails with useful logs instead of holding the manual control.
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y --no-install-recommends ccache
          fi
          ccache --version

      - name: Restore C++ compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: >-
            ccache-${{ runner.os }}-emsdk-6.0.3-${{
            hashFiles('native/**', 'patches/**', 'scripts/build-tpt-wasm.sh',
            'scripts/fetch-powder-toy.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-emsdk-6.0.3-${{ hashFiles('native/**', 'patches/**', 'scripts/build-tpt-wasm.sh', 'scripts/fetch-powder-toy.sh') }}-
            ccache-${{ runner.os }}-emsdk-6.0.3-

      - name: Cache project-local Emscripten
        uses: actions/cache@v6
        with:
          path: .toolchains/emsdk
          key: ${{ runner.os }}-emsdk-6.0.3-${{ hashFiles('scripts/setup-emsdk.sh') }}

      - name: Restore pinned Powder Toy libraries
        id: tpt-libs-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/the-powder-toy/subprojects/packagecache
          key: >-
            tpt-libs-${{ runner.os }}-${{
            hashFiles('third_party/the-powder-toy/REVISION',
            'scripts/build-tpt-wasm.sh') }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install pinned Emscripten locally
        run: npm run setup:emsdk

      - name: Install pinned Meson locally
        run: npm run setup:build-tools

      - name: Build WebAssembly, test, and build static site
        env:
          ANIFORTPT_REVISION: ${{ github.sha }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "true"
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_NOHASHDIR: "true"
          EM_COMPILER_WRAPPER: ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --zero-stats
          npm run build:all
          ccache --show-stats

      - name: Save C++ compiler cache after successful build
        if: success() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save pinned Powder Toy libraries after successful build
        if: success() && steps.tpt-libs-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/the-powder-toy/subprojects/packagecache
          key: ${{ steps.tpt-libs-restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: anifortpt-static-site
          path: dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-and-deploy')
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-and-deploy')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  verified_build:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve exact successful build artifact
        id: verified-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_BUILD_RUN_ID: ${{ inputs.verified_build_run_id }}
        run: >-
          node scripts/verify-pages-artifact-source.mjs
          --repository="${GITHUB_REPOSITORY}"
          --source-run-id="${VERIFIED_BUILD_RUN_ID}"
          --current-run-id="${GITHUB_RUN_ID}"
          --expected-sha="${GITHUB_SHA}"

      - name: Download exact verified static site
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.verified-source.outputs.artifact_id }}
          path: ${{ runner.temp }}/anifortpt-static-site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified-source.outputs.source_run_id }}
          digest-mismatch: error

      - name: Verify reused revision and runtime asset closure
        run: >-
          node scripts/verify-pages-artifact.mjs
          "${RUNNER_TEMP}/anifortpt-static-site"
          "${GITHUB_SHA}"

      - name: Publish verified static site for current-run consumers
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-static-site
          path: ${{ runner.temp }}/anifortpt-static-site
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/anifortpt-static-site

  visual-lab-review:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.visual_lab_review == true &&
      ((needs.build.result == 'success' && needs.verified_build.result == 'skipped') ||
       (needs.build.result == 'skipped' && needs.verified_build.result == 'success'))
    needs:
      - build
      - verified_build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the verified static site
        uses: actions/download-artifact@v8
        with:
          name: anifortpt-static-site
          path: dist

      - name: Capture deterministic Visual Lab review
        id: visual-lab-batch
        continue-on-error: true
        env:
          VISUAL_LAB_CANDIDATES: ${{ inputs.visual_lab_candidates }}
          VISUAL_LAB_BROWSER_HOST: ${{ inputs.visual_lab_browser_host }}
          VISUAL_LAB_CAPTURE_PROOF: ${{ inputs.visual_lab_capture_proof }}
          VISUAL_LAB_COHORT: ${{ inputs.visual_lab_cohort }}
          VISUAL_LAB_RECIPE_SET: ${{ inputs.visual_lab_recipe_set }}
        run: |
          review_args=(
            --bundle=dist/index.html
            --output-dir=artifacts/visual-lab-review
            --gpu=swiftshader
            # Route compatible normal-scale candidates sequentially through one
            # supervised SwiftShader process. Every candidate still receives a
            # fresh incognito context/target, and any capture, teardown, or GPU
            # failure recycles the complete host before the next candidate.
            "--browser-host=${VISUAL_LAB_BROWSER_HOST}"
            "--capture-proof=${VISUAL_LAB_CAPTURE_PROOF}"
          )
          candidate_request="${VISUAL_LAB_CANDIDATES//[[:space:]]/}"
          recipe_set_request="${VISUAL_LAB_RECIPE_SET//[[:space:]]/}"
          if [[ -n "${candidate_request}" && -n "${recipe_set_request}" ]]; then
            echo "visual_lab_candidates and visual_lab_recipe_set are mutually exclusive" >&2
            exit 2
          fi
          # GitHub supplies the cohort input's default even when workflow_dispatch
          # explicitly selects ad-hoc candidates or a recipe set. Those explicit
          # selectors therefore take precedence; use the cohort only as fallback.
          if [[ -z "${candidate_request}" && -z "${recipe_set_request}" ]]; then
            if [[ ! "${VISUAL_LAB_COHORT}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "visual_lab_cohort must be a safe kebab-case catalog name" >&2
              exit 2
            fi
            VISUAL_LAB_RECIPE_SET="$(node scripts/visual-lab-cohort-catalog.mjs \
              resolve --name="${VISUAL_LAB_COHORT}")"
            VISUAL_LAB_RECIPE_SET="$(realpath --relative-to=. -- "${VISUAL_LAB_RECIPE_SET}")"
            recipe_set_request="${VISUAL_LAB_RECIPE_SET}"
          fi
          if [[ -n "${recipe_set_request}" ]]; then
            node --input-type=module -e '
              import path from "node:path";
              const value = process.env.VISUAL_LAB_RECIPE_SET;
              const segments = value.split("/");
              if (path.posix.isAbsolute(value)
                || path.posix.normalize(value) !== value
                || segments.includes(".")
                || segments.includes("..")
                || !value.startsWith("visual-lab/recipe-sets/")
                || !value.endsWith(".json")) {
                throw new Error(
                  "visual_lab_recipe_set must be a canonical repository-relative path "
                  + "under visual-lab/recipe-sets",
                );
              }
            '
            git --literal-pathspecs ls-files --error-unmatch -- \
              "${VISUAL_LAB_RECIPE_SET}" >/dev/null
            recipe_set_path="$(realpath -e -- "${VISUAL_LAB_RECIPE_SET}")"
            case "${recipe_set_path}" in
              "${GITHUB_WORKSPACE}"/visual-lab/recipe-sets/*.json) ;;
              *)
                echo "visual_lab_recipe_set must resolve under visual-lab/recipe-sets" >&2
                exit 2
                ;;
            esac
            # Pass the original checked-in path so the Node loader can still
            # reject a tracked leaf or ancestor symlink rather than receiving
            # a pre-resolved path that has erased that evidence.
            review_args+=("--recipe-set=${VISUAL_LAB_RECIPE_SET}")
            printf 'recipe_set_source=%s\n' "${VISUAL_LAB_RECIPE_SET}" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${candidate_request}" ]]; then
            review_args+=("--candidates=${VISUAL_LAB_CANDIDATES}")
          fi
          node scripts/visual-lab-batch.mjs "${review_args[@]}"

      - name: Upload Visual Lab review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-visual-lab-${{ github.sha }}
          path: artifacts/visual-lab-review
          if-no-files-found: error
          include-hidden-files: true

      - name: Download uploaded Visual Lab review evidence
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: anifortpt-visual-lab-${{ github.sha }}
          path: ${{ runner.temp }}/anifortpt-visual-lab-review

      - name: Verify uploaded portable Visual Lab review
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.visual-lab-batch.outcome }}
          VISUAL_LAB_RECIPE_SET: ${{ steps.visual-lab-batch.outputs.recipe_set_source }}
          REVIEW_ROOT: ${{ runner.temp }}/anifortpt-visual-lab-review
        run: |
          test "${CAPTURE_OUTCOME}" = success
          verify_args=(
            "--batch-root=${REVIEW_ROOT}"
            --require-complete=1
            --require-recipe-set=1
            --require-browser-host-plan=1
            --require-capture-geometry=1
            --require-execution-tuning-plan=1
            --require-experiment-response=1
            --require-region-response=1
            --require-region-appearance=1
          )
          if [[ -n "${VISUAL_LAB_RECIPE_SET//[[:space:]]/}" ]]; then
            verify_args+=("--recipe-set-source=${VISUAL_LAB_RECIPE_SET}")
          fi
          node scripts/visual-lab-verify.mjs "${verify_args[@]}"

  visual-lab-performance-cohorts:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.visual_lab_performance_cohorts == true &&
      ((needs.build.result == 'success' && needs.verified_build.result == 'skipped') ||
       (needs.build.result == 'skipped' && needs.verified_build.result == 'success'))
    needs:
      - build
      - verified_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the verified static site
        uses: actions/download-artifact@v8
        with:
          name: anifortpt-static-site
          path: dist

      - name: Measure fresh and shared Visual Lab capture performance
        env:
          VISUAL_LAB_PERFORMANCE_COHORT: ${{ inputs.visual_lab_performance_cohort }}
        run: |
          if [[ ! "${VISUAL_LAB_PERFORMANCE_COHORT}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "visual_lab_performance_cohort must be a safe kebab-case catalog name" >&2
            exit 2
          fi
          performance_recipe_set="$(node scripts/visual-lab-cohort-catalog.mjs \
            resolve --name="${VISUAL_LAB_PERFORMANCE_COHORT}")"
          performance_recipe_set="$(realpath --relative-to=. -- "${performance_recipe_set}")"
          git --literal-pathspecs ls-files --error-unmatch -- "${performance_recipe_set}" >/dev/null
          recipe_set_path="$(realpath -e -- "${performance_recipe_set}")"
          case "${recipe_set_path}" in
            "${GITHUB_WORKSPACE}"/visual-lab/recipe-sets/*.json) ;;
            *)
              echo "visual_lab_performance_cohort must resolve under visual-lab/recipe-sets" >&2
              exit 2
              ;;
          esac
          node scripts/visual-lab-performance-cohorts.mjs \
            --recipe-set="${performance_recipe_set}" \
            --bundle=dist/index.html \
            --output-dir="${RUNNER_TEMP}/anifortpt-visual-lab-performance" \
            --gpu=swiftshader \
            --capture-proof=${{ inputs.visual_lab_performance_capture_proof }}

      - name: Upload bounded performance summary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-visual-lab-performance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anifortpt-visual-lab-performance/performance-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded performance identity diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-visual-lab-performance-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anifortpt-visual-lab-performance/performance-identity-failure.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: >-
      always() &&
      (needs.visual-lab-review.result == 'success' ||
       needs.visual-lab-review.result == 'skipped') &&
      ((needs.build.result == 'success' && needs.verified_build.result == 'skipped') ||
       (needs.build.result == 'skipped' && needs.verified_build.result == 'success')) &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.operation == 'build-and-deploy' || inputs.operation == 'deploy-verified')))
    needs:
      - build
      - verified_build
      - visual-lab-review
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages may remain in its service-side `updating_pages` state
          # after the artifact upload. `deploy-pages` accepts at most ten
          # minutes, so use that supported bound rather than requesting an
          # ignored larger value and emitting a release-time warning.
          timeout: 600000

  verify-deployment:
    # `deploy` deliberately tolerates a skipped optional visual review. Without
    # an explicit condition GitHub propagates that skipped transitive ancestor
    # through the default `success()` guard and silently skips live verification.
    if: always() && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify deployed revision and runtime asset closure
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-live-pages.mjs "${PAGE_URL}" "${GITHUB_SHA}"

      - name: Capture and verify deployed Visual Lab fixture package
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SMOKE_DIR: ${{ runner.temp }}/anifortpt-live-visual-lab-smoke
          DIAGNOSTIC_DIR: ${{ runner.temp }}/anifortpt-live-visual-lab-diagnostics
        run: |
          mkdir -p "${DIAGNOSTIC_DIR}"
          set -o pipefail
          google-chrome --version
          timeout --foreground --kill-after=15s 240s \
            node scripts/visual-lab-batch.mjs \
            --base-url="${PAGE_URL}" \
            --expected-revision="${GITHUB_SHA}" \
            --candidates=water-motion \
            --gpu=swiftshader \
            --capture-proof=completed-frame-receipt \
            --candidate-timeout-ms=180000 \
            --output-dir="${SMOKE_DIR}" \
            2>&1 | tail -c 65536 | tee "${DIAGNOSTIC_DIR}/batch.log"
          node scripts/visual-lab-verify.mjs \
            --batch-root="${SMOKE_DIR}" \
            --require-complete=1 \
            --require-recipe-set=1 \
            --require-browser-host-plan=1 \
            --require-capture-geometry=1 \
            --require-execution-tuning-plan=1 \
            --require-origin-attestation=1 \
            2>&1 | tail -c 65536 | tee "${DIAGNOSTIC_DIR}/verify.log"

      - name: Generate deployed Visual Lab smoke evidence
        env:
          SMOKE_DIR: ${{ runner.temp }}/anifortpt-live-visual-lab-smoke
          EVIDENCE_DIR: ${{ runner.temp }}/anifortpt-live-visual-lab-evidence
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          node scripts/live-visual-lab-smoke-evidence.mjs \
            --batch-root="${SMOKE_DIR}" \
            --expected-revision="${GITHUB_SHA}" \
            --browser-version="$(google-chrome --product-version)" \
            > "${EVIDENCE_DIR}/evidence.json"
          test "$(wc -c < "${EVIDENCE_DIR}/evidence.json")" -le 16384

      - name: Upload deployed Visual Lab smoke evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-live-visual-lab-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anifortpt-live-visual-lab-evidence/evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload deployed Visual Lab failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-live-visual-lab-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anifortpt-live-visual-lab-diagnostics
          if-no-files-found: warn
          retention-days: 7
