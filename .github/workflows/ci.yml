name: verify-static-game

on:
  push:
    branches-ignore:
      - main_codex
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Choose whether to verify the build or also deploy it to GitHub Pages
        required: true
        default: build
        type: choice
        options:
          - build
          - build-and-deploy
      visual_lab_review:
        description: Capture and publish a deterministic Visual Lab review batch
        required: true
        default: false
        type: boolean
      visual_lab_candidates:
        description: Optional comma-separated Visual Lab candidates; empty runs the frozen catalog
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A lost hosted runner can otherwise leave the manual Pages control in an
    # apparently-running state indefinitely.  Native compilation is normally
    # far below this bound, including a cold project-local toolchain cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            # Hosted apt mirrors occasionally stop responding. Bound this
            # bootstrap separately from native compilation so the workflow
            # fails with useful logs instead of holding the manual control.
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y --no-install-recommends ccache
          fi
          ccache --version

      - name: Restore C++ compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: >-
            ccache-${{ runner.os }}-emsdk-6.0.3-${{
            hashFiles('native/**', 'patches/**', 'scripts/build-tpt-wasm.sh',
            'scripts/fetch-powder-toy.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-emsdk-6.0.3-

      - name: Cache project-local Emscripten
        uses: actions/cache@v6
        with:
          path: .toolchains/emsdk
          key: ${{ runner.os }}-emsdk-6.0.3-${{ hashFiles('scripts/setup-emsdk.sh') }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install pinned Emscripten locally
        run: npm run setup:emsdk

      - name: Install pinned Meson locally
        run: npm run setup:build-tools

      - name: Build WebAssembly, test, and build static site
        env:
          ANIFORTPT_REVISION: ${{ github.sha }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "true"
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_NOHASHDIR: "true"
          EM_COMPILER_WRAPPER: ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --zero-stats
          npm run build:all
          ccache --show-stats

      - name: Save C++ compiler cache after successful build
        if: success() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: anifortpt-static-site
          path: dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-and-deploy')
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-and-deploy')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  visual-lab-review:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_lab_review == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the verified static site
        uses: actions/download-artifact@v8
        with:
          name: anifortpt-static-site
          path: dist

      - name: Capture deterministic Visual Lab review
        id: visual-lab-batch
        continue-on-error: true
        env:
          VISUAL_LAB_CANDIDATES: ${{ inputs.visual_lab_candidates }}
        run: |
          review_args=(
            --bundle=dist/index.html
            --output-dir=artifacts/visual-lab-review
            --gpu=swiftshader
          )
          if [[ -n "${VISUAL_LAB_CANDIDATES//[[:space:]]/}" ]]; then
            review_args+=("--candidates=${VISUAL_LAB_CANDIDATES}")
          fi
          node scripts/visual-lab-batch.mjs "${review_args[@]}"

      - name: Compare with the accepted Visual Lab baseline
        if: steps.visual-lab-batch.outcome == 'success'
        run: |
          node scripts/visual-lab-baseline.mjs compare \
            --baseline-root=visual-baselines/accepted-v1 \
            --result-root=artifacts/visual-lab-review \
            --output-dir=artifacts/visual-lab-review/comparison

      - name: Upload Visual Lab review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anifortpt-visual-lab-${{ github.sha }}
          path: artifacts/visual-lab-review
          if-no-files-found: error
          include-hidden-files: true

      - name: Require a complete Visual Lab review index
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.visual-lab-batch.outcome }}
        run: |
          test "${CAPTURE_OUTCOME}" = success
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            const index = JSON.parse(await readFile(
              'artifacts/visual-lab-review/index.json', 'utf8',
            ));
            if (index.schema !== 'anifor.visual-lab.batch/v1' || index.complete !== true) {
              throw new Error('Visual Lab review did not publish a complete v1 batch index');
            }
            const comparison = JSON.parse(await readFile(
              'artifacts/visual-lab-review/comparison/comparison.json', 'utf8',
            ));
            if (comparison.schema !== 'anifor.visual-lab.comparison/v1'
              || comparison.complete !== true) {
              throw new Error('Visual Lab review did not publish a complete v1 comparison');
            }
          "

  deploy:
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.visual-lab-review.result == 'success' ||
       needs.visual-lab-review.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-and-deploy'))
    needs:
      - build
      - visual-lab-review
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages may remain in its service-side `updating_pages` state
          # after the artifact upload. `deploy-pages` accepts at most ten
          # minutes, so use that supported bound rather than requesting an
          # ignored larger value and emitting a release-time warning.
          timeout: 600000

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployed revision and runtime asset closure
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-live-pages.mjs "${PAGE_URL}" "${GITHUB_SHA}"
